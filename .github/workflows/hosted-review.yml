name: Hosted mathematics review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: hosted-math-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hosted-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAPTURE_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact public source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CAPTURE_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install temporary browser dependencies
        timeout-minutes: 8
        shell: bash
        env:
          HOSTED_DEPS: ${{ runner.temp }}/hosted-math-deps
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hosted-math-browsers
        run: |
          mkdir -p "$HOSTED_DEPS"
          npm install --prefix "$HOSTED_DEPS" --ignore-scripts --no-audit --no-fund --save-exact \
            playwright@1.56.1 mathjax-full@3.2.1
          "$HOSTED_DEPS/node_modules/.bin/playwright" install --with-deps chromium

      - name: Capture every tracked Markdown page on GitHub
        timeout-minutes: 15
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/hosted-math-deps/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hosted-math-browsers
          HOSTED_OUTPUT: ${{ runner.temp }}/hosted-math-evidence
        run: |
          test "$(git rev-parse HEAD)" = "$CAPTURE_REVISION"
          node verification/hosted/capture_hosted_math.cjs \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$CAPTURE_REVISION" \
            --contract verification/hosted/math-contract.json \
            --output "$HOSTED_OUTPUT"

      - name: Preserve the actual report and captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-math-${{ env.CAPTURE_REVISION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-math-evidence/
          if-no-files-found: error
          retention-days: 30
